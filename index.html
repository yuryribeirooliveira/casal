22px;line-height:1.18;margin:8px 0 18px}.sales p{font-size:15px;line-height:1.35;margin:12px 0}.sales strong{font-weight:900}.sales img{display:block;max-width:100%;height:auto;margin:14px auto;border-radius:8px}.sales .center{text-align:center}.sales .choice{margin:8px 0}.video-title{font-size:22px;line-height:1.12;font-weight:900;margin:55px auto 18px}.video-box{position:relative;width:min(100%,312px);aspect-ratio:9/16;background:#050505;border-radius:12px;overflow:hidden;margin:0 auto 8px}.video-box img{width:100%;height:100%;object-fit:cover}.play{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:138px;height:138px;border:10px solid #f00;border-radius:50%;background:transparent;color:#f00;font-size:65px;line-height:110px;padding:0 0 0 8px;cursor:pointer}.play:disabled{cursor:default}.video-status{font-size:12px;color:#6b7280;margin:6px}.video-cta{animation:pulse 1.5s infinite}.checkout-note{font-size:12px;color:#6b7280;margin-top:10px}.footer{position:fixed;bottom:7px;left:0;right:0;text-align:center;font-size:10px;color:#6b7280}.footer a{color:#6b7280}.spinner{display:inline-block;width:12px;height:12px;border:2px solid #fecaca;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:4px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{filter:brightness(1.15);transform:scale(1.01)}}

function result(){step=5;base();screen.classList.add('sales');screen.innerHTML=`<div class="alert">ATENCIÓN: ¡No salgas de esta página!</div><h2>Tus probabilidades de volver con tu ex <span class="accent">SON SOLO DEL 12%</span> — esto es crítico — pero si sigues este protocolo, puedes <span class="accent">ASEGURAR que él vuelva</span> 👇</h2><p>Hola, qué tal!</p><p>Mi nombre es <strong>Sebastián Rivas</strong>.</p><p>Soy psicoanalista desde hace 7 años y ya he ayudado a <strong>más de 30 mil mujeres</strong> a volver con su ex.</p><p>Y si depende de mí, en las próximas 48 horas, <strong>tú serás la próxima.</strong></p><img src="data:image/png;base64,${A.profile}"><p>Y mira, ya he acompañado a <strong>más de 8 mil casos de mujeres como tú</strong> que querían recuperar a su ex.</p><p>Algunas de ellas con probabilidades mucho más bajas que las tuyas.</p><p>Pero al seguir el protocolo correcto, <strong>lograron reconquistar a su ex en menos de una semana.</strong></p><p>Como <strong>Rafaela, de México</strong>, que estaba bloqueada…y aun así consiguió que él volviera.</p><img src="data:image/png;base64,${A.depo1}"><p>O también, como <strong>Sofia, de Colombia</strong>, que vio a su ex saliendo con <strong>otra mujer</strong>.</p><p>Pero bastó con seguir el protocolo que voy a mostrarte aquí… y en solo <strong>7 días, él</strong> volvió con <strong>ella.</strong></p><img src="data:image/png;base64,${A.depo2}"><p>Y también está <strong>Carla, de México</strong>, que engañó a su novio… pero, a pesar de los errores que cometió, <strong>volvió con él.</strong></p><img src="data:image/png;base64,${A.depo3}"><p>Y ellas son solo <strong>3 de las más de 30 mil mujeres</strong> a las que he ayudado. <strong>A RECUPERAR A SU EX EN SOLO 7 DÍAS</strong>, mira ⬇️</p><img src="data:image/png;base64,${A.depo4}"><h3>Si esas <strong>mujeres</strong>, que estaban en una <strong>SITUACIÓN PEOR que la tuya</strong>, lograron volver con su ex en menos de 7 días, <strong>tú también puedes hacerlo.</strong> Mira cómo 👇</h3><p>Según tus respuestas, <strong>tus probabilidades de volver con él son del 12%</strong></p><p>Esto sucede porque el cerebro del <strong>hombre</strong> tiene dos lados: el racional y el emocional.</p><p>Y todo lo que has hecho hasta ahora para recuperarlo... <strong>solo ha reforzado en su mente que terminar fue lo mejor que pudo pasarle.</strong></p><p>Es como si su lado emocional estuviera apagado, haciéndote vivir un <strong>apagón emocional.</strong></p><p>La buena noticia es que ese lado emocional puede reactivarse cuando usas el estímulo correcto.</p><p>Y ese estímulo puede activarse con un solo mensaje de 3 palabras.</p><h2>¿Quieres que te revele ese mensaje ahora?</h2>`;screen.append(btn('Sí, revélamelo ahora',()=>{},'cta red'));screen.append(btn('Necesito saber más sobre ese mensaje',()=>question6(),'cta red'))}
